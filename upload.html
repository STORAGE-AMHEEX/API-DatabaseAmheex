<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AMHEEX STORAGE BLUE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron',sans-serif; -webkit-tap-highlight-color:transparent; }
body{ background:#020817; color:#fff; min-height:100vh; display:flex; justify-content:center; align-items:center; overflow-x:hidden; padding:20px; }
.bg{ position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at top,#00aaff22,transparent 35%), radial-gradient(circle at bottom,#0044ff22,transparent 40%), linear-gradient(135deg,#020817,#06152d,#020817); }
.container{ width:100%; max-width:700px; }
.top{ text-align:center; margin-bottom:25px; }
.top h1{ font-size:34px; color:#00cfff; text-shadow:0 0 20px #00cfff; }
.card{ background:rgba(255,255,255,.04); border:1px solid rgba(0,180,255,.15); border-radius:30px; padding:28px; backdrop-filter:blur(16px); box-shadow:0 0 40px rgba(0,150,255,.15); }
.group{ margin-bottom:20px; }
.label{ display:block; margin-bottom:10px; color:#00cfff; font-size:13px; text-align:center; }
.input{ width:100%; background:#081224; border:1px solid #173a74; border-radius:18px; color:#fff; padding:16px; outline:none; font-size:14px; text-align:center; transition:.2s; }
.input:focus{ border-color:#00cfff; box-shadow:0 0 18px #00cfff55; }
.fileBox{ background:#081224; border:2px dashed #00cfff66; border-radius:24px; padding:35px 20px; text-align:center; }
.fileBox input{ display:none; }
.fileBtn{ display:inline-flex; align-items:center; justify-content:center; padding:15px 26px; border-radius:18px; background:linear-gradient(135deg,#00cfff,#0055ff); color:#fff; font-size:13px; font-weight:bold; cursor:pointer; transition:.2s; }
.btn{ width:100%; border:none; border-radius:18px; padding:17px; cursor:pointer; color:#fff; font-weight:bold; font-size:13px; background:linear-gradient(135deg,#00cfff,#0055ff); transition:.2s; }
.btn:hover{ transform:translateY(-2px); }
.progress{ width:100%; height:12px; background:#081224; border-radius:999px; overflow:hidden; margin-top:20px; display:none; }
.progressBar{ width:0%; height:100%; background:linear-gradient(90deg,#00cfff,#0055ff); transition:.25s; }
.status{ margin-top:15px; color:#00cfff; font-size:12px; text-align:center; }
.console{ margin-top:22px; background:#030913; border:1px solid #163868; border-radius:20px; min-height:240px; max-height:420px; overflow:auto; padding:18px; white-space:pre-wrap; color:#66ffcc; font-size:13px; word-break:break-word; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
    <div class="top"><h1>AMHEEX STORAGE</h1></div>
    <div class="card">
        <div class="group">
            <label class="label">CONFIGURAR PATH MANUAL</label>
            <input type="text" id="path" class="input" placeholder="Ex: pasta/arquivo.txt">
        </div>
        <div class="group">
            <div class="fileBox">
                <label for="fileInput" class="fileBtn">ESCOLHER ARQUIVO</label>
                <input type="file" id="fileInput">
                <div class="fileName" id="fileName" style="margin-top:15px; font-size:12px; color:#9eb2d1;">Nenhum arquivo selecionado</div>
            </div>
        </div>
        <button class="btn" onclick="iniciarUpload()">INICIAR UPLOAD</button>
        <div class="progress" id="progress"><div class="progressBar" id="progressBar"></div></div>
        <div class="status" id="status">Sistema pronto.</div>
        <div class="console" id="console">AMHEEX STORAGE BLUE ONLINE...</div>
    </div>
</div>

<script>
const API_LIST = ["https://storage-amheex.onrender.com"];
const fileInput = document.getElementById("fileInput");
const pathInput = document.getElementById("path");
const consoleBox = document.getElementById("console");
const statusBox = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const progress = document.getElementById("progress");

fileInput.addEventListener("change", () => {
    if (fileInput.files.length) {
        document.getElementById("fileName").innerText = fileInput.files[0].name;
        // Opcional: Se o campo Path estiver vazio, preenche com o nome do arquivo para ajudar
        if(!pathInput.value.trim()){
            pathInput.value = fileInput.files[0].name;
        }
    } else {
        document.getElementById("fileName").innerText = "Nenhum arquivo selecionado";
    }
});

function log(msg) { consoleBox.innerText = msg; }
function status(msg) { statusBox.innerText = msg; }

async function iniciarUpload() {
    const path = pathInput.value.trim();
    
    if (!path) {
        alert("Por favor, configure o Path onde o arquivo será salvo.");
        return;
    }
    
    if (!fileInput.files.length) {
        alert("Selecione um arquivo para fazer o upload!");
        return;
    }
    
    const file = fileInput.files[0];
    progress.style.display = "block";
    progressBar.style.width = "20%";
    status("Enviando arquivo para o Path especificado...");

    try {
        const content = await file.arrayBuffer();
        const response = await fetch(API_LIST[0] + "/" + path, { 
            method: "POST", 
            body: content 
        });
        
        const result = await response.text();
        
        progressBar.style.width = "100%";
        log("UPLOAD CONCLUÍDO NO PATH!\n\nStatus: " + response.status + "\nPath Destino: " + path + "\nResposta da API: " + (result || "OK"));
        status("Upload finalizado.");
        
        setTimeout(() => {
            progress.style.display = "none";
        }, 1500);
        
    } catch (err) {
        log("ERRO AO ENVIAR: " + err);
        status("Falha no upload.");
    }
}
</script>
</body>
</html>
