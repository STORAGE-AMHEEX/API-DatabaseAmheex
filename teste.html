<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>AMHEEX STORAGE ULTRA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#050816;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

.bg{
    position:fixed;
    inset:0;
    z-index:-1;

    background:
    radial-gradient(circle at top left,#00e5ff22,transparent 35%),
    radial-gradient(circle at bottom right,#ff00ff22,transparent 35%),
    linear-gradient(135deg,#050816,#09111f,#050816);
}

.container{
    width:95%;
    max-width:980px;
    margin:25px auto;
}

.top{
    text-align:center;
    margin-bottom:24px;
}

.top h1{
    font-size:35px;
    color:#00e5ff;
    text-shadow:0 0 15px #00e5ff;
}

.top p{
    margin-top:8px;
    color:#9aa0b3;
    font-size:13px;
}

.card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    padding:22px;
    backdrop-filter:blur(14px);

    box-shadow:
    0 0 30px rgba(0,229,255,.12);
}

.group{
    margin-bottom:18px;
}

.label{
    display:block;
    margin-bottom:8px;
    color:#00e5ff;
    font-size:13px;
}

.input,
.textarea{
    width:100%;
    background:#091124;
    border:1px solid #1a2d63;
    border-radius:18px;
    color:#fff;
    padding:15px;
    outline:none;
    font-size:14px;
}

.input:focus,
.textarea:focus{
    border-color:#00e5ff;
    box-shadow:0 0 15px #00e5ff55;
}

.textarea{
    min-height:170px;
    resize:vertical;
}

.fileBox{
    background:#091124;
    border:2px dashed #00e5ff55;
    border-radius:22px;
    padding:25px;
    text-align:center;
}

.fileBox input{
    display:none;
}

.fileBtn{
    display:inline-block;
    padding:14px 22px;
    border-radius:14px;

    background:
    linear-gradient(135deg,#00e5ff,#0066ff);

    cursor:pointer;
    font-size:13px;
    font-weight:bold;
}

.fileName{
    margin-top:12px;
    color:#bbb;
    font-size:12px;
    word-break:break-all;
}

.actions{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    flex:1;
    min-width:180px;
    border:none;
    border-radius:18px;
    padding:16px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
    transition:.2s;
}

.btn:active{
    transform:scale(.98);
}

.upload{
    background:
    linear-gradient(135deg,#00e5ff,#0066ff);
}

.read{
    background:
    linear-gradient(135deg,#ff00ff,#7b2cff);
}

.progress{
    width:100%;
    height:11px;
    background:#091124;
    border-radius:999px;
    overflow:hidden;
    margin-top:16px;
    display:none;
}

.progressBar{
    width:0%;
    height:100%;
    background:
    linear-gradient(90deg,#00e5ff,#0066ff);
    transition:.2s;
}

.status{
    margin-top:15px;
    color:#00e5ff;
    font-size:12px;
}

.console{
    margin-top:18px;
    background:#02040d;
    border:1px solid #162040;
    border-radius:18px;
    min-height:250px;
    max-height:450px;
    overflow:auto;
    padding:18px;
    white-space:pre-wrap;
    word-break:break-word;
    color:#00ff99;
    font-size:13px;
}

@media(max-width:700px){

.top h1{
    font-size:27px;
}

.card{
    padding:16px;
}

}
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">

<div class="top">

<h1>AMHEEX STORAGE</h1>

<p>
Upload Inteligente • Retry Automático • Anti-Falhas
</p>

</div>

<div class="card">

<div class="group">

<label class="label">
CAMINHO DO ARQUIVO
</label>

<input
type="text"
id="path"
class="input"
placeholder="Ex: pasta/teste.txt">

</div>

<div class="group">

<div class="fileBox">

<label
for="fileInput"
class="fileBtn">

SELECIONAR ARQUIVO

</label>

<input
type="file"
id="fileInput">

<div
class="fileName"
id="fileName">

Nenhum arquivo selecionado

</div>

</div>

</div>

<div class="group">

<label class="label">
FALLBACK TEXTO
</label>

<textarea
id="manualText"
class="textarea"
placeholder="Digite conteúdo manual caso não envie arquivo..."></textarea>

</div>

<div class="actions">

<button
class="btn upload"
onclick="uploadFile()">

ENVIAR

</button>

<button
class="btn read"
onclick="readFile()">

LER

</button>

</div>

<div
class="progress"
id="progress">

<div
class="progressBar"
id="progressBar"></div>

</div>

<div
class="status"
id="status">

Sistema pronto.

</div>

<div
class="console"
id="console">

AMHEEX STORAGE ONLINE...

</div>

</div>

</div>

<script>
const API_LIST = [

"https://storage-amheex.onrender.com",

"https://storage-amheex.onrender.com/"

];

const RETRY_MAX = 5;

const fileInput =
document.getElementById("fileInput");

const fileName =
document.getElementById("fileName");

const consoleBox =
document.getElementById("console");

const statusBox =
document.getElementById("status");

const progress =
document.getElementById("progress");

const progressBar =
document.getElementById("progressBar");

fileInput.addEventListener(
"change",
()=>{

    if(fileInput.files.length){

        fileName.innerText =
        fileInput.files[0].name;

    }else{

        fileName.innerText =
        "Nenhum arquivo selecionado";

    }

});

function log(msg){

    consoleBox.innerText = msg;

}

function add(msg){

    consoleBox.innerText +=
    "\n" + msg;

    consoleBox.scrollTop =
    consoleBox.scrollHeight;

}

function status(msg){

    statusBox.innerText = msg;

}

function setProgress(v){

    progress.style.display =
    "block";

    progressBar.style.width =
    v + "%";

    if(v >= 100){

        setTimeout(()=>{

            progress.style.display =
            "none";

        },1200);

    }

}

function sleep(ms){

    return new Promise(r=>
    setTimeout(r,ms)
    );

}

async function getContent(){

    // ARQUIVO
    if(fileInput.files.length){

        const file =
        fileInput.files[0];

        return await new Promise(
        (resolve,reject)=>{

            const reader =
            new FileReader();

            reader.onload =
            e=>resolve(
            e.target.result
            );

            reader.onerror =
            ()=>reject(
            "Falha ao ler arquivo."
            );

            reader.readAsArrayBuffer(
            file
            );

        });

    }

    // FALLBACK TEXTO
    return document
    .getElementById("manualText")
    .value;

}

async function uploadFile(){

    const path =
    document
    .getElementById("path")
    .value
    .trim();

    if(!path){

        alert(
        "Informe caminho."
        );

        return;

    }

    try{

        status(
        "Preparando upload..."
        );

        setProgress(5);

        const content =
        await getContent();

        if(
            !content ||
            content.byteLength === 0 ||
            content.length === 0
        ){

            alert(
            "Conteúdo vazio."
            );

            return;

        }

        let uploaded = false;

        for(const API of API_LIST){

            for(
                let attempt = 1;
                attempt <= RETRY_MAX;
                attempt++
            ){

                try{

                    status(
                    "Conectando..."
                    );

                    setProgress(
                    10 + (attempt * 10)
                    );

                    add(
`Tentativa ${attempt}
API:
${API}`
                    );

                    const response =
                    await fetch(
                        API + "/" + path,
                        {
                            method:"POST",
                            body:content,
                            headers:{
                                "Accept":"*/*"
                            }
                        }
                    );

                    if(!response.ok){

                        throw new Error(
                        "HTTP " +
                        response.status
                        );

                    }

                    setProgress(75);

                    const text =
                    await response.text();

                    setProgress(100);

                    uploaded = true;

                    log(
`UPLOAD FINALIZADO

STATUS:
${response.status}

RESPOSTA:
${text || "OK"}

ARQUIVO:
${path}`
                    );

                    status(
                    "Upload concluído."
                    );

                    break;

                }catch(err){

                    add(
`FALHA:

${err}`
                    );

                    status(
                    "Reconectando..."
                    );

                    await sleep(2000);

                }

            }

            if(uploaded){

                break;

            }

        }

        if(!uploaded){

            log(
`FALHA TOTAL UPLOAD

Possíveis causas:

• API offline
• Internet instável
• CORS bloqueado
• Arquivo muito grande
• Servidor lento
• Timeout conexão`
            );

            status(
            "Falha upload."
            );

            progress.style.display =
            "none";

        }

    }catch(err){

        progress.style.display =
        "none";

        log(
`ERRO:

${err}`
        );

        status(
        "Erro upload."
        );

    }

}

async function readFile(){

    const path =
    document
    .getElementById("path")
    .value
    .trim();

    if(!path){

        alert(
        "Informe caminho."
        );

        return;

    }

    try{

        status(
        "Lendo arquivo..."
        );

        setProgress(20);

        let loaded = false;

        for(const API of API_LIST){

            for(
                let attempt = 1;
                attempt <= RETRY_MAX;
                attempt++
            ){

                try{

                    add(
`Leitura tentativa:
${attempt}`
                    );

                    const response =
                    await fetch(
                        API + "/X/" + path,
                        {
                            method:"GET",
                            headers:{
                                "Accept":"*/*"
                            }
                        }
                    );

                    if(!response.ok){

                        throw new Error(
                        "HTTP " +
                        response.status
                        );

                    }

                    setProgress(80);

                    const text =
                    await response.text();

                    setProgress(100);

                    loaded = true;

                    log(
                    text ||
                    "Arquivo vazio."
                    );

                    status(
                    "Leitura concluída."
                    );

                    break;

                }catch(err){

                    add(
`FALHA:

${err}`
                    );

                    await sleep(2000);

                }

            }

            if(loaded){

                break;

            }

        }

        if(!loaded){

            log(
`FALHA LEITURA

Possíveis causas:

• API offline
• Arquivo inexistente
• Caminho inválido
• Timeout conexão
• Servidor indisponível`
            );

            status(
            "Falha leitura."
            );

            progress.style.display =
            "none";

        }

    }catch(err){

        progress.style.display =
        "none";

        log(
`ERRO:

${err}`
        );

        status(
        "Erro leitura."
        );

    }

}
</script>

</body>
</html>
