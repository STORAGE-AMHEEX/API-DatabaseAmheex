<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amhex Ai - Gerador de Vídeo Sem CORS</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #238636;
            --accent-hover: #2ea043;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 700px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        h2 { margin-top: 0; font-size: 1.25rem; text-align: center; color: #f0f6fc; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #8b949e; }

        textarea, input[type="file"] {
            width: 100%; box-sizing: border-box; background-color: var(--bg);
            border: 1px solid var(--border); color: var(--text); border-radius: 6px;
            padding: 8px 12px; font-size: 0.9rem;
        }
        textarea { resize: vertical; height: 70px; }

        button, .btn-download {
            width: 100%; padding: 12px; background-color: var(--accent); color: white;
            border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
            font-size: 1rem; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box;
        }
        button:hover, .btn-download:hover { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-box { margin-top: 20px; padding: 16px; background-color: var(--bg); border: 1px solid var(--border); border-radius: 6px; display: none; }
        .result-content { font-family: monospace; white-space: pre-wrap; word-break: break-word; color: #58a6ff; font-size: 0.85rem; margin-bottom: 15px; }

        video { width: 100%; border-radius: 6px; border: 1px solid var(--border); background: #000; display: none; margin-bottom: 12px; }
        .loading { text-align: center; display: none; color: #58a6ff; margin-top: 12px; font-size: 0.85rem; }

        .log-container {
            margin-top: 15px; background: #000; border: 1px solid var(--border); border-radius: 6px;
            padding: 10px; font-family: monospace; font-size: 0.75rem; max-height: 250px; overflow-y: auto;
            color: #f0f6fc; white-space: pre-wrap; word-break: break-all;
        }
        .log-entry { margin-bottom: 8px; border-bottom: 1px dashed #21262d; padding-bottom: 6px; }
        .log-error { color: #f85149; }
        .log-success { color: #56d364; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Amhex Ai - Gerador de Vídeo (Queue API)</h2>
    
    <form id="apiForm">
        <div class="form-group">
            <label for="text">Etapa 1: Instrução / Comando de Texto:</label>
            <textarea id="text" placeholder="Ex: Uma bola quicando em um estúdio..."></textarea>
        </div>

        <div class="form-group">
            <label for="media">Etapa 2: Mídia/Print de Referência (Opcional):</label>
            <input type="file" id="media" accept="image/*">
        </div>

        <button type="submit" id="btnSubmit">Gerar e Renderizar Vídeo</button>
    </form>

    <div class="loading" id="loading">Gerando prompt e processando o vídeo...</div>

    <div class="result-box" id="resultBox">
        <div style="font-size: 0.75rem; color: #8b949e; margin-bottom: 6px;">PROMPT GERADO:</div>
        <div class="result-content" id="resultContent"></div>

        <div style="font-size: 0.75rem; color: #8b949e; margin-bottom: 6px;">VIDEOVIEW:</div>
        <video id="videoPlayer" controls autoplay loop></video>

        <a id="btnDownload" class="btn-download" style="display:none;" download="video-amhex-ai.mp4">Baixar Vídeo (.mp4)</a>

        <div style="font-size: 0.75rem; color: #8b949e; margin-top: 15px; margin-bottom: 6px;">LOGS REAIS E RESPOSTA DA API:</div>
        <div class="log-container" id="logContainer"></div>
    </div>
</div>

<script>
    const geminiKey = "AQ.Ab8RN6I9V9TdiIDP4d9whWlH0YlhbACwH-AzvMnca1u-3hQhIw";
    const siteKey = "d8d129ab-1b62-4786-84ca-b7bba947de21:2c993f5c3093727cdd01ca517abfb5d8";

    function addLog(msg, isError = false, isSuccess = false) {
        const logContainer = document.getElementById('logContainer');
        const entry = document.createElement('div');
        entry.className = 'log-entry ' + (isError ? 'log-error' : (isSuccess ? 'log-success' : ''));
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logContainer.appendChild(entry);
        logContainer.scrollTop = logContainer.scrollHeight;
    }

    const fileToBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    async function obterRespostaGeminiMultimodal(parts) {
        addLog("Gerando o prompt descritivo no Gemini...");
        const payload = {
            contents: [{ parts: parts }],
            generationConfig: { temperature: 0.4 }
        };

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const textRaw = await res.text();

            if (res.ok) {
                const data = JSON.parse(textRaw);
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    addLog("Prompt gerado com sucesso pelo Gemini.", false, true);
                    return data.candidates[0].content.parts[0].text;
                }
            } else {
                addLog(`ERRO PROMPT GEMINI - HTTP ${res.status}:\n${textRaw}`, true);
            }
        } catch (e) {
            addLog(`EXCEÇÃO GEMINI: ${e.message}`, true);
        }
        return null;
    }

    async function gerarVideoQueueFalAi(promptText) {
        addLog("Enviando requisição para a Queue API da Fal.ai...");

        // Endpoint de fila da Fal.ai com suporte nativo a CORS
        const submitUrl = "https://queue.fal.run/fal-ai/ltx-video";

        try {
            const res = await fetch(submitUrl, {
                method: "POST",
                headers: {
                    "Authorization": `Key ${siteKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ prompt: promptText })
            });

            const textRaw = await res.text();

            if (!res.ok) {
                addLog(`ERRO FAL.AI QUEUE - HTTP ${res.status}:\n${textRaw}`, true);
                return null;
            }

            const queueData = JSON.parse(textRaw);
            const requestId = queueData.request_id;
            addLog(`Tarefa enviada com sucesso! Request ID: ${requestId}`, false, true);

            // Verificação de status (Polling)
            const statusUrl = `https://queue.fal.run/fal-ai/ltx-video/requests/${requestId}/status`;
            const resultUrl = `https://queue.fal.run/fal-ai/ltx-video/requests/${requestId}`;

            while (true) {
                await new Promise(r => setTimeout(r, 2000));
                
                const statusRes = await fetch(statusUrl, {
                    headers: { "Authorization": `Key ${siteKey}` }
                });
                const statusData = await statusRes.json();

                addLog(`Status da geração: ${statusData.status}...`);

                if (statusData.status === "COMPLETED") {
                    const resultRes = await fetch(resultUrl, {
                        headers: { "Authorization": `Key ${siteKey}` }
                    });
                    const resultData = await resultRes.json();

                    if (resultData.video && resultData.video.url) {
                        return resultData.video.url;
                    }
                } else if (statusData.status === "FAILED") {
                    addLog(`Falha na fila da Fal.ai: ${JSON.stringify(statusData)}`, true);
                    return null;
                }
            }

        } catch (e) {
            addLog(`ERRO DE CONEXÃO: ${e.message}`, true);
        }

        return null;
    }

    document.getElementById('apiForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btnSubmit = document.getElementById('btnSubmit');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const videoPlayer = document.getElementById('videoPlayer');
        const btnDownload = document.getElementById('btnDownload');

        document.getElementById('logContainer').innerHTML = '';

        const textInput = document.getElementById('text').value.trim();
        const mediaInput = document.getElementById('media').files[0];

        btnSubmit.disabled = true;
        loading.style.display = 'block';
        resultBox.style.display = 'block';
        videoPlayer.style.display = 'none';
        btnDownload.style.display = 'none';

        try {
            const parts = [];

            if (mediaInput) {
                addLog(`Lendo mídia de referência...`);
                const b64 = await fileToBase64(mediaInput);
                parts.push({ 
                    inlineData: {
                        mimeType: mediaInput.type,
                        data: b64.split(',')[1]
                    } 
                });
            }

            parts.push({
                text: `Analise a instrução: '${textInput}'. Gere um prompt descritivo em inglês para geração de vídeo. Responda APENAS com o prompt.`
            });

            const promptVideo = await obterRespostaGeminiMultimodal(parts);

            if (!promptVideo) {
                resultContent.textContent = 'Erro ao obter prompt. Verifique a chave do Gemini.';
                return;
            }

            resultContent.textContent = promptVideo;

            const videoUrl = await gerarVideoQueueFalAi(promptVideo);

            if (videoUrl) {
                addLog("Vídeo gerado com sucesso!", false, true);
                videoPlayer.src = videoUrl;
                videoPlayer.style.display = 'block';

                btnDownload.href = videoUrl;
                btnDownload.style.display = 'inline-block';
            } else {
                addLog("Falha ao renderizar o vídeo. Veja os logs acima.", true);
            }

        } catch (error) {
            addLog(`ERRO JS: ${error.message}`, true);
        } finally {
            btnSubmit.disabled = false;
            loading.style.display = 'none';
        }
    });
</script>

</body>
</html>
