function tocarAudioAPI(url, button, automatico = false){
  if(!url) return false;

  if(typeof audioAtual !== "undefined" && audioAtual && !audioAtual.paused){
    try { audioAtual.pause(); } catch(_) {}
    document.querySelectorAll(".audio-action.playing").forEach(b => b.classList.remove("playing"));

    if(audioAtual.src === url){
      audioAtual = null;
      return true;
    }
  }

  const novoAudio = new Audio(url);
  novoAudio.preload = "auto";
  novoAudio.playsInline = true;
  audioAtual = novoAudio;

  if(button) button.classList.add("playing");

  const p = novoAudio.play();
  if(p && typeof p.catch === "function"){
    p.catch(() => {
      if(button) button.classList.remove("playing");
    });
  }

  novoAudio.onended = () => {
    if(button) button.classList.remove("playing");
    if(audioAtual === novoAudio) audioAtual = null;
  };

  novoAudio.onerror = () => {
    if(button) button.classList.remove("playing");
    if(audioAtual === novoAudio) audioAtual = null;
  };

  return true;
}

function extractApiText(data){
  if(typeof data === "string") return {text:data.trim(), audio_url:""};

  if(data && typeof data === "object"){
    const keys = ["text","response","resposta","message","mensagem","output","content","answer","resultado"];
    let text = "";
    for(const key of keys){
      if(typeof data[key] === "string" && data[key].trim()){
        text = data[key].trim();
        break;
      }
    }

    let audio_url = "";
    const audioKeys = ["audio_url","audioUrl","audio","audio_url_response","url_audio"];
    for(const key of audioKeys){
      if(typeof data[key] === "string" && data[key].trim()){
        audio_url = data[key].trim();
        break;
      }
    }

    if(!text && data.data){
      return extractApiText(data.data);
    }

    return {text, audio_url};
  }

  return {text:"", audio_url:""};
}

async function askApi(text, filesArray){
  const activeChat = getActiveChat();
  const chatId = activeChat ? String(activeChat.id || "") : "";
  const apiEndpoint = "https://ai-amheex.onrender.com/api/index.php";

  const filesPayload = (Array.isArray(filesArray) ? filesArray : [])
    .filter(f => f && f.url)
    .map((f, index) => ({
      id: String(f.id || `file_${Date.now()}_${index}`),
      name: String(f.name || `arquivo_${index + 1}`),
      url: String(f.url),
      size: Number(f.size || 0),
      type: String(f.type || "application/octet-stream")
    }));

  // O endpoint de perguntas recebe JSON. Não misturamos FormData com JSON:
  // isso evita campos duplicados e garante que URLs dos arquivos cheguem
  // exatamente como foram enviados pelo navegador.
  const payload = {
    version: 2,
    token: String(USER_TOKEN || ""),
    chat_id: chatId,
    text: String(text || ""),
    pergunta: String(text || ""),
    message: String(text || ""),
    arquivos_json: {
      version: 2,
      files: filesPayload
    },
    files: filesPayload,
    arquivo_url: filesPayload.map(f => f.url),
    JSON_url_arquigos: filesPayload,
    json_url_arquigos: {
      version: 2,
      files: filesPayload
    }
  };

  const response = await fetch(apiEndpoint, {
    method: "POST",
    body: JSON.stringify(payload),
    cache: "no-store",
    // Não seguir redirecionamentos neste POST. A pergunta deve chegar
    // diretamente ao api.php, sem 301/302/307/308 no caminho.
    redirect: "manual",
    headers: {
      "Content-Type": "application/json; charset=UTF-8",
      "Accept": "application/json, text/plain, */*"
    }
  });

  // Em navegadores, um redirect cross-origin pode aparecer como
  // opaqueredirect (status 0). Não tratar isso como uma pergunta enviada.
  if (response.type === "opaqueredirect") {
    throw new Error("A API redirecionou o POST. O envio foi cancelado; use o endpoint direto do api.php.");
  }

  const raw = await response.text();
  let data = raw;
  try { data = JSON.parse(raw); } catch(_) {}

  if(!response.ok){
    const msg = extractApiText(data).text ||
      (data && typeof data.message === "string" ? data.message : "") ||
      raw || `API HTTP ${response.status}`;
    throw new Error(`HTTP ${response.status}: ${msg}`);
  }

  if(data && typeof data === "object" && data.status === "error"){
    throw new Error(data.message || "A API recusou a pergunta.");
  }

  return extractApiText(data);
}

async function waitForChatUpdate(chatId, initialMessageCount, maxAttempts = 60, intervalMs = 2000) {
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    try {
      const url = storageUrl(true) + `&_=${Date.now()}`;
      const response = await fetch(url, { cache: "no-store", mode: "cors" });
      if (response.ok) {
        const rawText = (await response.text()).trim();
        if(!rawText || rawText.startsWith("Erro:") || rawText.startsWith("<!")) {
          await new Promise(resolve => setTimeout(resolve, intervalMs));
          continue;
        }
        const rawData = JSON.parse(rawText);
        const normalized = normalizeHistory(rawData);
        const remoteChats = normalized.chats.map(normalizeChat);
        
        const remoteChat = remoteChats.find(c => c.id === chatId);
        if (remoteChat && remoteChat.mensagens.length > initialMessageCount) {
          const lastMsg = remoteChat.mensagens[remoteChat.mensagens.length - 1];
          if (lastMsg && lastMsg.role === "assistant") {
            return {
              text: lastMsg.text,
              audio_url: lastMsg.audio_url || "",
              timestamp: lastMsg.timestamp,
              remoteChat
            };
          }
        }
      }
    } catch (e) {}
    await new Promise(resolve => setTimeout(resolve, intervalMs));
  }
  throw new Error("Tempo esgotado aguardando a resposta no JSON do chat.");
}

async function sendMessage(){
  const aiLoader = showAiThinkingLoader();

  if(waiting) return;

  const text = preprocessConversationContent(promptInput.value).trim();
  const currentFiles = [...selectedFiles];

  const uploadingFiles = currentFiles.filter(f => f && f.uploading);
  const failedFiles = currentFiles.filter(f => f && f.uploadError);

  if(uploadingFiles.length > 0){
    showUploadError("Aguarde o término do upload dos arquivos antes de enviar.");
    return;
  }

  if(failedFiles.length > 0){
    showUploadError("Remova o arquivo com falha no upload e selecione-o novamente.");
    return;
  }

  if(!text && currentFiles.length === 0) return;

  if(!tokenOk()){
    showError("Informe o token na URL: ?token=SEU_TOKEN");
    return;
  }

  let chat = getActiveChat();
  if(!chat){
    startNewChat(false);
    chat = getActiveChat();
  }

  waiting = true;
  sendBtn.disabled = true;
  promptInput.value = "";
  
  selectedFiles = [];
  fileInput.value = "";
  filePreviewContainer.classList.remove("active");
  resizeComposer();

  if(!chat.mensagens.length){
    chat.titulo = titleFromText(text || (currentFiles[0] ? currentFiles[0].name : "Arquivos enviados"));
  }

  const initialCount = chat.mensagens.length;

  const userMessage = {
    role:"user",
    text,
    files: currentFiles,
    timestamp:nowIso()
  };

  chat.mensagens.push(userMessage);
  chat.atualizado_em = nowIso();

  renderActiveChat();
  renderHistory();

  // Envio manual do usuário: somente aqui descemos a conversa inteira.
  amheexScrollAfterUserSend();

  // Não gravamos o histórico aqui. O api.php/server.php é o responsável
  // por persistir a pergunta; salvar antes causava perguntas órfãs/duplicadas
  // quando o Storage retornava 500/502. A mensagem continua visível localmente.

  const loadingRow = document.createElement("div");
  loadingRow.className = "message-row ai";
  loadingRow.innerHTML = `
    <div class="message-main">
      <img class="message-avatar" src="${esc(DEFAULT_ICON)}" alt="AMHEEX">
      <div class="message-content">
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  `;
  chatInner.appendChild(loadingRow);

  try{
    await askApi(text, currentFiles);
    const result = await waitForChatUpdate(chat.id, initialCount + 1);

    loadingRow.remove();

    const respostaProcessada = preprocessConversationContent(result.text ?? "");
    const assistantMessage = {
      role:"assistant",
      text:respostaProcessada,
      audio_url:result.audio_url || "",
      timestamp:result.timestamp || nowIso()
    };

    chat.mensagens.push(assistantMessage);
    chat.atualizado_em = nowIso();

    const responseScrollTop = chatArea.scrollTop;
    hideAiThinkingLoader();
    const responseRow = await appendStreamingAssistantMessage(
      assistantMessage.text, assistantMessage.timestamp, assistantMessage.audio_url
    );
    requestAnimationFrame(() => { chatArea.scrollTop = responseScrollTop; });

    if(assistantMessage.audio_url){
      tocarAudioAPI(
        assistantMessage.audio_url,
        responseRow.querySelector(".audio-action"),
        true
      );
    }

    renderHistory();
    await saveHistory();
  }catch(error){
    hideAiThinkingLoader();
    loadingRow.remove();
    const errorRow = document.createElement("div");
    errorRow.className = "error-box";
    errorRow.innerHTML = `
      Não foi possível obter uma resposta agora.
      <br><small>${esc(error.message)}</small>
      <br><button class="retry" type="button">Tentar novamente</button>
    `;

    chatInner.appendChild(errorRow);
    errorRow.querySelector(".retry").addEventListener("click", async () => {
      if(waiting) return;
      errorRow.remove();
      promptInput.value = text;
      selectedFiles = currentFiles.map(file => ({ ...file }));
      renderFilePreviews();
      resizeComposer();
      await sendMessage();
    });
  }finally{
    waiting = false;
    sendBtn.disabled = false;
    promptInput.focus();
  }
}

async function loadUserInfo(){
  if(!USER_TOKEN) return;

  // Importante: NÃO usar o prefixo /X/ no storage para fetch do browser.
  // O caminho com /X/ não envia (ou envia de forma inconsistente) o header
  // Access-Control-Allow-Origin e quebra o CORS. O padrão que funciona
  // (login/index.js e o histórico de chat) é SEM /X/ e com ?download=1.
  const possible = [
    `https://api-storageamheex.onrender.com/AMHEEX/AI/USER/${encodeURIComponent(USER_TOKEN)}/index.json`,
    `https://api-storageamheex.onrender.com/AMHEEX/USER/${encodeURIComponent(USER_TOKEN)}/index.json`,
    // fallback legado com /X/ (caso o storage mude de comportamento)
    `https://api-storageamheex.onrender.com/X/AMHEEX/AI/USER/${encodeURIComponent(USER_TOKEN)}/index.json`,
    `https://api-storageamheex.onrender.com/X/AMHEEX/USER/${encodeURIComponent(USER_TOKEN)}/index.json`
  ];

  for(const baseUrl of possible){
    try{
      const url = baseUrl + (baseUrl.includes("?") ? "&" : "?") + `download=1&_=${Date.now()}`;
      const r = await fetch(url, { cache: "no-store", mode: "cors" });
      if(!r.ok) continue;

      const data = await r.json();
      if(!data || typeof data !== "object") continue;

      const imagem =
        data.imagem_url ||
        data.imagem ||
        data.avatar ||
        data.foto ||
        data.image_url ||
        data.photo_url ||
        data.avatar_url ||
        "";

      const nome =
        data.USUARIO_NORMAL ||
        data.usuario_normal ||
        data.nome ||
        data.name ||
        data.usuario ||
        data.user ||
        data.username ||
        "";

      if(imagem){
        drawerAvatar.src = String(imagem);
        topAvatar.src = String(imagem);
      }
      if(nome){
        accountName.textContent = String(nome);
      }

      // Se encontrou pelo menos um dado útil, para de tentar outros caminhos
      if(imagem || nome) break;
    }catch(_){}
  }
}

function executarTelaLogin(){
  const antigo = document.getElementById("amheex-login-script");
  if(antigo) return;

  const script = document.createElement("script");
  script.id = "amheex-login-script";
  script.src = "login/index.js";
  script.async = false;
  script.onerror = () => showError("Não foi possível carregar a tela de login.");
  document.body.appendChild(script);
}

async function init(){
  resizeComposer();

  if(!USER_TOKEN){
    executarTelaLogin();
    return;
  }

  await loadUserInfo();
  renderWelcome();
  await loadHistory(true);
  amheexMarkHistoryFingerprint();
  amheexStartHistoryPolling();
}

init();
</script>
</body>
</html>
